# Every URL below points at the upstream project. Forked this tool? Repoint
# them at your repository, or delete this folder.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/DuvInc/mcp-agent-tester/discussions
    about: Anything that is not a bug report or a concrete feature request.
  - name: Security issue
    url: https://github.com/DuvInc/mcp-agent-tester/security/advisories/new
    about: Please report privately rather than in a public issue.
  - name: A problem with OpenRouter, a model or the server you test
    url: https://openrouter.ai/docs
    about: Keys, quotas, rate limits, model behaviour and the faults of the server under test belong with those services.
